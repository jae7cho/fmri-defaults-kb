# Curated 2026-11-11: the C-PAC configuration keys that answer each preprocessing step, the 1.7 flat
# keys and the 1.8 nested paths both (C-PAC's own map links them: options[].nested_as / flat_as).
# Selected by key pattern, then reviewed: keys of group analysis (MDMR), eye tracking (PyPEER), ALFF and
# the motion-estimate filter removed; the nuisance Regressors key added to temporal filtering and
# scrubbing (from 1.4.1 the band-pass edges and censoring are set inside it).
# 2026-11-11: each entry claims the releases (from_version..to_version on the inventory's timeline) at
# which the option answers the step; seeded from the option's availability, split where it has gaps.
# tests/test_pipeline_options.py fails on any claimed release where the option does not exist.
