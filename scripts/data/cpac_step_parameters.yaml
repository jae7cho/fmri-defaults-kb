    1.0.0-1.7.2; registration_workflows.functional_registration.func_registration_to_template.output_resolution
    1.8). Brain-mask warps use nearest neighbour (hard-coded).
- step: smoothing
  parameter: method_and_target
  ranges:
  - from_version: 0.3.2
    to_version: 1.6.0
    value: fslmaths -kernel gauss sigma -fmean -mas <mask>, sigma = FWHM/2.3548; applied to derivative
      maps (ALFF, ReHo, SCA, VMHC, centrality, etc.) as the last step, not to the preprocessed BOLD series;
      derivatives written smoothed and unsmoothed
    source: v0.3.2 CPAC/utils/utils.py line 171-182; v0.3.2 CPAC/GUI/interface/pages/smoothing.py line
      46; v1.6.0 CPAC/image_utils/spatial_smoothing.py line 6-12
    config_key: fwhm
  - from_version: 1.6.1
    to_version: 1.7.2
    value: FSL (as above) or AFNI 3dBlurToFWHM (blur TO the given FWHM, within mask)
    source: v1.6.1 CPAC/image_utils/spatial_smoothing.py line 25, 70-74
    config_key: fwhm; smoothing_method
  - from_version: 1.8.0
    to_version: 1.8.7
    value: FSL or AFNI 3dBlurToFWHM, applied to outputs listed in Outputs.to_smooth (derivatives)
    source: v1.8.7 CPAC/image_utils/spatial_smoothing.py line 39-41, 67-101; v1.8.7 CPAC/pipeline/engine.py
      line 858-864
    config_key: post_processing.spatial_smoothing.{run,fwhm,smoothing_method,output}
  notes: 'Default FWHM pre-1.0.3: GUI default ''4'' in every 0.3.x/1.0.x GUI (smoothing.py line 44 at
    0.3.2/0.3.9.1, line 37 at 1.0.x); the shipped example configs/pipeline_config.yml has fwhm [4] at
    0.3.2-0.3.5 and [6] at 0.3.6-1.0.2.'
- step: temporal_filtering
  parameter: method
  ranges:
  - from_version: 0.3.2
    to_version: 1.4.0
    value: 'ideal FFT band-pass (REST/Yan Chao-Gan port): voxel series demeaned, zero-padded to next power
      of 2, FFT bins outside [ceil(low*N*TR), fix(high*N*TR)] zeroed, inverse FFT; output demeaned; TR
      from NIfTI header (/1000 if >20)'
    source: v0.3.2 CPAC/nuisance/nuisance.py line 8-100
    config_key: runFrequencyFiltering; nuisanceBandpassFreq
  - from_version: 1.4.1
    to_version: 1.7.2
    value: same ideal FFT filter (moved to CPAC/nuisance/bandpass.py)
    source: v1.4.1 CPAC/nuisance/bandpass.py line 8-45; v1.6.1 CPAC/nuisance/bandpass.py line 8-47
    config_key: Regressors[].Bandpass.{bottom_frequency,top_frequency}
  - from_version: 1.8.0
    to_version: 1.8.7
    value: method 'default' = same ideal FFT filter; method 'AFNI' = 3dBandpass on BOLD (with mask) +
      1dBandpass on regressors
    source: v1.8.7 CPAC/nuisance/bandpass.py line 8-44; v1.8.7 CPAC/nuisance/nuisance.py line 1696-1778
    config_key: nuisance_corrections.2-nuisance_regression.Regressors[].Bandpass.{method,bottom_frequency,top_frequency}
  notes: 'Band edges always come from the config; nothing hard-coded. Example yml default band [0.01,0.1]
    at 0.3.2-0.3.5 and [0.009,0.1] at 0.3.6-1.0.2 (GUI filtering.py line 54 at 0.3.2: [0.01, 0.1]).'
- step: temporal_filtering
