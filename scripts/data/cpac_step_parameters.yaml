# Curated 2026-11-11: values fixed in C-PAC's workflow code (not configuration keys), by version range,
# read at tags of FCP-INDI/C-PAC by a delegated reader; 5 random citations spot-checked. Copied into
# kb/pipeline_options/cpac.yaml by scripts/extract_pipeline_options.py --step-parameters.
# UNVERIFIED items are marked in place.
- step: slice_timing
  parameter: program_and_options
  ranges:
  - from_version: 0.3.2
    to_version: 1.8.7
    value: AFNI 3dTshift via nipype TShift, outputtype NIFTI_GZ only; no -tzero (until 1.8.1), no -rlt/-ignore/interpolation
      option set, so AFNI defaults apply (interpolation and reference time are AFNI defaults, not set
      by C-PAC)
    source: v0.3.2 CPAC/func_preproc/func_preproc.py line 298-300; v1.8.7 CPAC/func_preproc/func_preproc.py
      line 411-420
    config_key: null
  notes: AFNI's own default reference time (when neither -tzero nor -slice is given) is not visible in
    C-PAC code; per AFNI documentation it is the mean of the slice offsets. Not verified by running.
- step: slice_timing
  parameter: reference_slice
  ranges:
  - from_version: 0.3.2
    to_version: 0.3.5
    value: -slice (tslice) taken from the 'reference' column of the subject list scan_parameters
    source: v0.3.2 CPAC/func_preproc/func_preproc.py line 315-316; v0.3.2 CPAC/utils/utils.py line 1074
    config_key: subject list scan_parameters 'reference'
  - from_version: 0.3.6
    to_version: 1.8.0
    value: no reference slice/time passed (tslice no longer connected; no tzero) -> AFNI default
    source: v0.3.9.1 CPAC/pipeline/cpac_pipeline.py line 1193-1249; v1.8.0 CPAC/func_preproc/func_preproc.py
      line 405-421
    config_key: null
  - from_version: 1.8.1
    to_version: 1.8.7
    value: -tzero set only if config tzero is not None; otherwise AFNI default
    source: v1.8.7 CPAC/func_preproc/func_preproc.py line 419-420, 708-709
    config_key: functional_preproc.slice_timing_correction.tzero
- step: slice_timing
  parameter: pattern_source_and_switch
  ranges:
  - from_version: 0.3.2
    to_version: 0.3.5
    value: STC runs only if the subject list provides scan_parameters (no config switch); tpattern = 'acquisition'
      (AFNI keyword or slice-timing file prefixed '@'); TR from scan params, converted ms->s if >10
    source: v0.3.2 CPAC/pipeline/cpac_pipeline.py line 490-531; v0.3.2 CPAC/utils/utils.py line 1072-1118
    config_key: null
  - from_version: 0.3.6
    to_version: 1.0.2
    value: STC toggled by config; tpattern connected from scan params unless slice_timing_pattern contains
      'Use NIFTI Header' (then 3dTshift reads header timing)
    source: v0.3.9.1 CPAC/pipeline/cpac_pipeline.py line 1187-1249
    config_key: slice_timing_correction; slice_timing_pattern
  - from_version: 1.0.3
    to_version: 1.8.7
    value: Pattern from data config / BIDS JSON SliceTiming list (written to tpattern.txt and passed as
      @file) or pipeline slice_timing_pattern; 'Use NIFTI Header' -> header; if max slice offset > TR
      the TR is converted to ms
    source: v1.0.3 CPAC/utils/utils.py line 1560-1652; v1.8.7 CPAC/utils/utils.py line 879-972
    config_key: slice_timing_pattern (<=1.7.2); functional_preproc.slice_timing_correction.tpattern (1.8.x)
  notes: From 1.8.x a non-None config tpattern overrides the data-derived pattern (v1.8.7 func_preproc.py
    line 447-448).
- step: distortion_correction
  parameter: methods_available
  ranges:
  - from_version: 0.3.2
    to_version: 1.0.2
    value: none (no fieldmap/blip code in tree)
    source: v1.0.2 CPAC/pipeline/cpac_pipeline.py (no FUGUE/Qwarp/distcor references)
    config_key: null
  - from_version: 1.0.3
    to_version: 1.4.3
    value: 'PhaseDiff only: FSL fsl_prepare_fieldmap + FUGUE (save_fmap) -> despiked fieldmap passed to
      FLIRT BBR (fieldmap, echospacing, pedir); raises an error if BBR is off'
    source: v1.0.3 CPAC/EPI_DistCorr/EPI_DistCorr.py line 102-160; v1.0.3 CPAC/pipeline/cpac_pipeline.py
      line 1308-1325, 1692
    config_key: runEPI_DistCorr; fmap_distcorr_*
  - from_version: 1.5.0
    to_version: 1.8.1
    value: 'PhaseDiff (as above) and Blip: opposite-PE EPI aligned to mean func with FLIRT cost corratio;
      AFNI 3dQwarp -plusminus; warp converted to ANTs format, applied with LanczosWindowedSinc; blip warp
      folded into the func->template ANTs transform'
    source: v1.5.0 CPAC/distortion_correction/distortion_correction.py line 235-330; v1.8.7 CPAC/distortion_correction/distortion_correction.py
      line 315-321, 431-432, 479-486; v1.8.7 CPAC/registration/registration.py line 3190-3195
    config_key: distortion_correction (1.5-1.7); functional_preproc.distortion_correction.using (1.8)
  - from_version: 1.8.2
    to_version: 1.8.7
    value: 'adds Blip-FSL-TOPUP: topup called with --datain/--imain only (no --config, so FSL built-in
      defaults); FLIRT dof 6 spline SBRef->phase; applywarp spline; BET frac 0.35 on fieldmap magnitude'
    source: v1.8.2 CPAC/distortion_correction/distortion_correction.py line 472-481; v1.8.7 CPAC/distortion_correction/utils.py
      line 325-329; v1.8.7 CPAC/distortion_correction/distortion_correction.py line 727-729, 777-779,
      869-871
    config_key: functional_preproc.distortion_correction.using
  notes: 'Default ''using'' list is in the YAML (1.8.7: [''PhaseDiff'',''Blip'']). PhaseDiff output is
    used only inside BBR coregistration in every version (not applied as a separate unwarp).'
- step: coregistration
  parameter: initial_linear_func_to_anat
  ranges:
  - from_version: 0.3.2
    to_version: 1.8.0
    value: FSL FLIRT, cost corratio, dof 6, interp trilinear (all hard-coded); mean functional -> skull-stripped
      T1
    source: v0.3.2 CPAC/registration/registration.py line 283-286; v0.3.2 CPAC/pipeline/cpac_pipeline.py
      line 757; v1.7.0 CPAC/registration/registration.py line 353-354, 969; v1.8.0 CPAC/registration/registration.py
      line 482-483, 2066
    config_key: null
  - from_version: 1.8.1
    to_version: 1.8.7
    value: FSL FLIRT; interp, cost, dof (and extra arguments) read from config
    source: v1.8.7 CPAC/registration/registration.py line 713-717
    config_key: registration_workflows.functional_registration.coregistration.{interpolation,cost,dof,arguments}
- step: coregistration
  parameter: bbr
  ranges:
  - from_version: 0.3.2
    to_version: 1.8.0
    value: FLIRT -cost bbr -wmseg <WM mask>, dof 6, initialised with the linear matrix; WM mask = WM probability
      map thresholded '-thr 0.5 -bin'; schedule from config
    source: v0.3.2 CPAC/registration/registration.py line 393-436; v0.3.2 CPAC/pipeline/cpac_pipeline.py
      line 828, 841-843; v1.8.0 CPAC/registration/registration.py line 596, 607
    config_key: runBBReg; boundaryBasedRegistrationSchedule (<=1.7.2)
  - from_version: 1.8.1
    to_version: 1.8.7
    value: FLIRT -cost bbr and dof 6 still hard-coded; WM-mask fslmaths op string and WM map type (probability/partial-volume)
      from config
    source: v1.8.7 CPAC/registration/registration.py line 971-976; v1.8.7 CPAC/registration/registration.py
      line 3083-3097
    config_key: registration_workflows.functional_registration.coregistration.boundary_based_registration.{bbr_schedule,bbr_wm_mask_args,bbr_wm_map}
- step: normalization
  parameter: anat_to_template_ANTs
  ranges:
  - from_version: 0.3.2
    to_version: 0.3.2
    value: legacy ANTS via nipype GenWarpFields (antsIntroduction-style), parameters left at interface
      defaults
    source: v0.3.2 CPAC/registration/registration.py line 514
    config_key: regOption
  - from_version: 0.3.5
    to_version: 1.0.2
    value: 'antsRegistration (nipype) hard-coded: Rigid[0.1]/Affine[0.1] with MI (32 bins, Regular 0.25),
      SyN[0.1,3,0] with CC radius 4 on whole-head images; iterations 1000x500x250x100 (rigid/affine) and
      100x100x70x20 (SyN); shrink 8x4x2x1/6x4x2x1; sigmas 3x2x1x0; histogram matching; winsorize 0.01-0.99'
    source: v0.3.9.1 CPAC/pipeline/cpac_pipeline.py line 598-630
    config_key: regOption
  - from_version: 1.0.3
    to_version: 1.6.1
    value: same parameter set issued as a hard-coded antsRegistration command line (hardcoded_reg)
    source: v1.0.3 CPAC/registration/utils.py line 14-45
    config_key: regOption
  - from_version: 1.6.2
    to_version: 1.8.7
    value: antsRegistration parameters read from config (ants_para)
    source: v1.6.2 CPAC/registration/registration.py line 540, 570; v1.8.7 CPAC/registration/utils.py
      line 66-75
    config_key: ANTs_para_T1_registration (1.6.2-1.7.2); registration_workflows.anatomical_registration.registration.ANTs.T1_registration
      (1.8)
- step: normalization
  parameter: anat_to_template_FSL
  ranges:
  - from_version: 0.3.2
    to_version: 1.8.7
    value: FLIRT cost corratio (dof left at FLIRT default 12) then FNIRT with fnirtConfig (T1_2_MNI152_2mm
      default in GUI)
    source: v0.3.2 CPAC/registration/registration.py line 82-89
    config_key: regOption; fnirtConfig
  notes: Only verified at 0.3.2 in detail; later versions keep create_nonlinear_register (dof not set)
    but the line was not re-checked per version. UNVERIFIED for 1.x.
- step: normalization
  parameter: func_to_template_interpolation
  ranges:
  - from_version: 0.3.2
    to_version: 0.3.2
    value: FSL applywarp with no interp set (FSL default trilinear); ANTs path WarpTimeSeriesImageMultiTransform
      (interface default)
    source: v0.3.2 CPAC/pipeline/cpac_pipeline.py line 1346-1348, 1435
    config_key: null
  - from_version: 0.3.5
    to_version: 1.4.3
    value: FSL applywarp no interp set (trilinear default); ANTs antsApplyTransforms interpolation 'Linear'
      hard-coded; FLIRT func->anat converted to ITK and concatenated with anat->template
    source: v0.3.9.1 CPAC/pipeline/cpac_pipeline.py line 2037-2039, 2288; v1.4.0 CPAC/pipeline/cpac_pipeline.py
      line 2240-2242, 2331-2340
    config_key: null
  - from_version: 1.5.0
    to_version: 1.7.2
    value: from config; if funcRegANTSinterpolation is missing the code sets LanczosWindowedSinc
    source: v1.5.0 CPAC/pipeline/cpac_pipeline.py line 1955-1971, 2292; v1.6.0 CPAC/pipeline/cpac_pipeline.py
      line 296-301
    config_key: funcRegANTSinterpolation; funcRegFSLinterpolation
  - from_version: 1.8.0
    to_version: 1.8.7
    value: from config
    source: v1.8.0 CPAC/registration/registration.py line 2292-2296
    config_key: registration_workflows.functional_registration.func_registration_to_template.{ANTs_pipelines,FNIRT_pipelines}.interpolation
  notes: Template files and output resolution are config keys in every version (standardResolution/standardResolutionBrain
