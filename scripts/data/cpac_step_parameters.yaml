    source: v0.3.2 CPAC/pipeline/cpac_pipeline.py line 1059, 1143, 1228-1240
    config_key: null
  - from_version: 1.4.1
    to_version: 1.6.0
    value: after 3dTproject regression, on residuals only
    source: v1.4.1 CPAC/pipeline/cpac_pipeline.py line 2103-2137
    config_key: null
  - from_version: 1.6.1
    to_version: 1.7.2
    value: 'configurable: ''Before'' = filter BOLD and regressors then regress; ''After'' = regress then
      filter'
    source: v1.6.1 CPAC/pipeline/cpac_pipeline.py line 2630-2640, 2691, 2767; v1.6.1 CPAC/nuisance/nuisance.py
      line 1499
    config_key: filtering_order
  - from_version: 1.8.0
