pipeline_id: cpac
display_name: C-PAC
aliases:
  - cpac
  - C-PAC
  - CPAC
  - "Configurable Pipeline for the Analysis of Connectomes"
  # Some papers write "Configurable Pipeline for Analysis of Connectomes" (no "the",
  # e.g. Vanderwal 2016). The parenthetical-acronym path in recognize() resolves
  # "...(C-PAC)" via the C-PAC alias, so that variant is covered without an explicit
  # alias; add one only if a test shows a paper omitting both "the" AND the acronym.
component_tools: []
notes: |
  Version timeline ONLY. param_defaults intentionally empty across all versions.
  Rationale: C-PAC is a configure-from-template pipeline shipping ~10 presets
  (default, ccs-options, fmriprep-options, abcd-options, ndmg, rbc-options, ...);
  a "default config" value is not a reliable stand-in for an unstated field, so no
  param defaults are asserted. Whether param defaults are worth encoding for any
  pipeline is deferred to external (NARPS) evidence on field pipeline/version usage.

  Checked 2026-10-28 against github.com/FCP-INDI/C-PAC tags and releases (gh api repos/FCP-INDI/C-PAC/tags):
  the tags run v0.3.9 -> v0.3.9.1 (released 2015-04-02) -> v1.0.0 (released 2016-11-03); there is NO
  0.4.0 tag or release. A corpus paper (oconnor_2017) states "0.4.0" as its C-PAC version: a version
  the project never released under that tag. It is not added to the timeline; a lookup of "0.4.0" is
  an unknown version, and the paper's statement is the gap, not the timeline.
  This doc exists so resolve_version() exercises the date_inferred_version path.

  Development versions (e.g. OConnor 2017's stated "C-PAC 0.4.0", which lived untagged
  between v0.3.9.1 and v1.0.0) have no release artifact and are intentionally NOT recorded;
  such versions cannot be date-resolved to a canonical release.

  Stable releases only (a/b/rc/.dev/.post excluded). Dates are git tag creatordate
  (v1.3.0 is a lightweight tag with no creatordate; its commit date 2018-10-10 is used).
realignment_tool:
  ranges:
  - from_version: 0.3.2
    to_version: 1.6.1
    program: 3dvolreg
    package: afni
    stable_across_range: true
    configurable: false
    source: CPAC/func_preproc/func_preproc.py at every listed tag from v0.3.2 to v1.6.1 builds AFNI 3dvolreg
      (Volreg) and contains no mcflirt; checked 2026-11-09.
    choice_source: 'No realignment choice: the default configs (configs/pipeline_config.yml to v1.0.2;
      CPAC/resources/configs/pipeline_config_template.yml v1.0.3 to v1.6.1) carry no motion-correction
      method key before v1.6.0, and at v1.6.0 and v1.6.1 the template''s ''motion_correction : [AFNI]''
      (lines 570 and 693) is read by no code (func_preproc.py and pipeline/cpac_pipeline.py at those tags
      contain neither the key nor mcflirt).'
    notes: 'Supersedes the 2026-10-28 split at 1.0.0: every tag in the range was read on 2026-11-09, so
      the range is verified (stable). A paper''s C-PAC configuration file, where it states a program,
      is a citation-hop target.'
  - from_version: 1.6.2
    program: 3dvolreg
    package: afni
    stable_across_range: true
    configurable: true
    options:
    - 3dvolreg
    - mcflirt
    source: 'The C-PAC default pipeline configuration at every listed tag from v1.6.2: ''motion_correction
      : [3dvolreg]'' (dev/docker_data/default_pipeline.yml lines 557-558 at v1.6.2, 645-646 at v1.7.0,
      659-660 at v1.7.1-v1.7.2) and ''using: [3dvolreg]'' under motion_correction (dev/docker_data/default_pipeline.yml
      lines 860-864 at v1.8.0 to 1058-1062 at v1.8.4; CPAC/resources/configs/pipeline_config_default.yml
      lines 1074-1078 at v1.8.5, 1079-1085 at v1.8.6, 1081-1087 at v1.8.7).'
    choice_source: 'The same configs offer the choice (''Options: AFNI 3dvolreg, FSL mcflirt'' to v1.7.2;
      ''# using: [3dvolreg, mcflirt]'' from v1.8.0), and CPAC/func_preproc/func_preproc.py reads the key
      and builds mcflirt from v1.6.2 to v1.8.5 (the module was reorganised at v1.8.6; the configs still
      offer both).'
    notes: The default is a template value; the user's own configuration decides. A paper that states
      its configuration or cites it resolves the program from that source.

