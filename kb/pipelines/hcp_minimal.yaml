      intensity_normalization.value:
        value: 10000
        proposed_confidence: 0.95
        source: "HCPpipelines fMRIVolume/scripts/IntensityNormalization.sh @ v4.1.3, line 224 (-ing 10000)."
      brain_extraction.parameters:
        value: "the MNI template brain mask brought into the subject by inverting an initial FLIRT + FNIRT registration (PreFreeSurfer); the final mask is FreeSurfer wmparc binarized, dilated three times and eroded twice (PostFreeSurfer)"
        proposed_confidence: 0.95
        source: "Glasser, M.F. et al. (2013). The minimal preprocessing pipelines for the Human Connectome Project. NeuroImage 80:105-124 (author manuscript PMC3720813, PDF page 12 and 15, PreFreeSurfer and PostFreeSurfer pipelines) -- initial brain extraction by registration to the MNI template and inverse-warping its brain mask; the final brain mask from the wmparc parcellation. Read from the paper (fix 3 of 2026-11-05); the paper predates this tag and the scripts at the tag were not read."
      segmentation.method:
