        source: "Glasser, M.F. et al. (2013). The minimal preprocessing pipelines for the Human Connectome Project. NeuroImage 80:105-124 (author manuscript PMC3720813, PDF page 14, FreeSurfer pipeline) -- recon-all's automated segmentation of the T1w volume. Read from the paper (fix 3 of 2026-11-05); the paper predates this tag and the scripts at the tag were not read."
