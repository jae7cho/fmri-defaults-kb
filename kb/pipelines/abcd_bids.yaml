pipeline_id: abcd_bids
display_name: ABCD-BIDS (abcd-hcp-pipeline)
aliases:
  - abcd_bids
  - ABCD-BIDS
  - ABCD-BIDS pipeline
  - abcd-hcp-pipeline
  - ABCD-HCP pipeline
  - DCAN Labs ABCD-BIDS pipeline
component_tools:
  - tool: fsl
    role: "between-volume realignment with MCFLIRT (DCAN-HCP fMRIVolume)"
notes: |
  Added 2026-11-09 (the author's KB list). The DCAN Labs BIDS application (github.com/DCAN-Labs/
  abcd-hcp-pipeline) that wraps DCAN-HCP, an HCP-pipelines derivative. Versions are its GitHub
  releases less those GitHub marks as pre-release (v0.1.1, v0.2.0rc1), v0.0.0 to v0.1.5.

  nuisance_regression param_defaults added 2026-11-19 from the DCANBOLDProcessing stage
  (github.com/DCAN-Labs/dcan_bold_processing), read at the tag each release installs. The regressor
  code (conc.m, make_friston_regressors.m) has the same git blob at every tag v4.0.0 to v4.0.13, and
  dcan_signal_processing.m lines 67 and 87 are unchanged across them. v0.0.4 installs a branch since
  deleted, so its record carries needs_verification. ABCD collection 3165 (docs/release_notes.md)
  was processed with v0.0.3. Papers that describe this stage tend to list the tissue regressors and
  omit the motion ones (marek_2022).
realignment_tool:
  ranges:
  - program: MCFLIRT
    package: fsl
    verification: script_at_tag
    stable_across_range: true
    source: DCAN-Labs/abcd-hcp-pipeline app/pipelines.py line 65 (mctype = 'MCFLIRT') at every listed
      release, passed to DCAN-HCP as --mctype; the Dockerfile pins DCAN-HCP v2.0.0 (to v0.1.3) or v2.0.1
      (from v0.1.4), where fMRIVolume/scripts/MotionCorrection.sh lines 33-34 send MCFLIRT to global/scripts/mcflirt.sh,
      which runs FSL's mcflirt (line 71).
    notes: Checked 2026-11-09 at every listed tag. DCAN-HCP's mcflirt.sh registers to the scout image
      (-r), a pipeline setting that differs from MCFLIRT's own default reference; it is not recorded as
      a tool default.
    configurable: false
    choice_source: app/pipelines.py line 65 sets mctype = 'MCFLIRT' as a module constant passed to DCAN-HCP
      as --mctype (line 752 at v0.0.0, 779 at v0.1.5); app/run.py exposes no motion-correction option
      (checked at v0.0.0 and v0.1.5). DCAN-HCP itself accepts --mctype FLIRT, but the application does
      not let the user set it.

versions:
  - version: "v0.0.0"
    version_kind: tag
    release_date: "2019-03-07"
    release_source: "https://github.com/DCAN-Labs/abcd-hcp-pipeline/releases/tag/v0.0.0"
    param_defaults:
      nuisance_regression.motion_expansion:
        value: friston24
        proposed_confidence: 0.95
        source: "DCAN-Labs/abcd-hcp-pipeline v0.0.0 Dockerfile line 226 clones dcan_bold_processing v4.0.0. dcan_bold_processing v4.0.0 matlab_code/dcan_signal_processing.m line 67 FR = make_friston_regressors(MR) on the 6 realignment parameters; matlab_code/hcp_matlab/make_friston_regressors.m lines 40-44 FR = [MR MR.^2] plus the same shifted one frame (24 regressors), rotations converted to mm on a 50 mm radius (lines 31-38)."
      nuisance_regression.tissue_regressors:
        value:
          - whole_brain
          - white_matter
          - ventricles
        proposed_confidence: 0.95
        source: "DCAN-Labs/abcd-hcp-pipeline v0.0.0 Dockerfile line 226 clones dcan_bold_processing v4.0.0. dcan_bold_processing v4.0.0 matlab_code/dcan_signal_processing.m line 87 R = conc(wm, vent, WB, FR), WB = mean(X) the whole-brain mean (line 83); matlab_code/hcp_matlab/conc.m lines 7-10 sR = [wm vent WB], R = [sR dR FR]."
      nuisance_regression.regressor_list:
        value: "36 regressors: white matter, ventricles and whole-brain mean signals, their first differences, and 24 Friston motion regressors (6 realignment parameters, their squares, and both shifted one frame)"
