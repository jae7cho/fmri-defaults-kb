        source: "DCAN-Labs/abcd-hcp-pipeline v0.0.0 Dockerfile line 226 clones dcan_bold_processing v4.0.0. dcan_bold_processing v4.0.0 matlab_code/dcan_signal_processing.m line 87 R = conc(wm, vent, WB, FR); matlab_code/hcp_matlab/conc.m lines 7-10 (white matter, ventricles, whole brain, their first differences, then the 24 Friston regressors)."
