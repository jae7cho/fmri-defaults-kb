pipeline_id: fmriprep
display_name: fMRIPrep
aliases:
  - fmriprep
  - fMRIPrep
  - "fMRIPrep (Esteban et al.)"
  - fmri-prep
  - fmri prep
component_tools: []
notes: |
  Version timeline for this build, PLUS one hand-authored param_default:
  surface_projection.surface_registration (a target_surface-conditional, the
  first production use of the B1 conditional machinery). Everything else --
  fMRIPrep's full per-flag inventory -- remains intentionally empty here and is
  deferred to the Sub-A auto-parsed kb/tools/fmriprep/{version}.yaml path (unbuilt,
  unwired). surface_registration is carved out because it is a hand-derived
  conditional with a version boundary, which the argparse-oriented Sub-A auto-parser
  does not emit, and because the working route get_param_defaults() actually reads is
  pipelines/*.yaml param_defaults (as in ccs.yaml / hcp_minimal.yaml).

  Boundary basis (code/changelog-verified, DERIVED, ceiling 0.70), keyed on the
  paper's EXTRACTED surface_projection.target_surface:
    - native / fsaverage / fsaverage5 / fsaverage6 -> freesurfer_recon at ALL versions.
    - fsLR_32k -> freesurfer_recon for version < 23.2.0, msm_sulc for >= 23.2.0
      (nipreps/fmriprep CHANGES.rst 23.2.0, 2024-01-10; PR #3085: MSM-Sulc "enabled by
      default", --no-msm to disable). The boundary is by VERSION (>= 23.2.0), not date.
  fsLR_164k is intentionally omitted: fMRIPrep emits fsLR densities 10k/32k/41k and CIFTI
  grayordinates 91k (32k mesh) / 170k (59k mesh) -- there is no 164k output, so only
  fsLR_32k maps to a TargetSurface literal (source: resampling.py density=10k/32k/41k;
  config.py + cli/parser.py --cifti-output choices 91k/170k). target_space / resolution_mm
  are CLI (--output-spaces) and stay paper-extracted, not defaulted here.

  This document also lets resolve_version() exercise against a dense, public release
  timeline (date_inferred_version path). Stable releases only (rc/alpha/beta/post
  excluded). Dates from github.com/nipreps/fmriprep release tags.

realignment_tool:
  ranges:
  - program: MCFLIRT
    package: fsl
    verification: manual
    stable_across_range: true
    source: 'Esteban, O. et al. (2019). fMRIPrep: a robust preprocessing pipeline for functional MRI.
      Nature Methods 16:111-116; the fMRIPrep documentation, ''Head-motion estimation'' (mcflirt, FSL),
      unchanged across the listed releases.'
    notes: Recorded 2026-10-28 for the agent's motion_correction.method inference arm. Head-motion parameters
      are estimated with FSL MCFLIRT in every listed release; the per-flag inventory stays deferred to
      kb/tools/fmriprep/{version}.yaml (unbuilt).
    configurable: false
    choice_source: fmriprep/workflows/bold/hmc.py builds fsl.MCFLIRT and no other realignment program
      at every listed version, 1.0.0 to 25.2.0 (line 68 at 1.0.0, 83 at 20.2.0, 105 at 23.2.0, 93 at 25.2.0);
      fMRIPrep offers no option for the program.


# 2026-11-11: what fMRIPrep's head-motion step passes to FSL MCFLIRT, read at the tags of
# nipreps/fmriprep (and the niworkflows versions they pin) by a delegated reader and spot-checked:
# hmc.py line 68 at 1.0.0 and line 93 at 25.0.0; the mcflirt node's outgoing connections at 1.0.0,
# 20.2.0 and 25.0.0 (mat_file, par_file, rms_files; never out_file). init_bold_hmc_wf builds the
# MCFLIRT node at every listed version and sets only output flags (save_mats, save_plots to 24.1.0,
# save_rms from 20.1.0 to 24.1.0) plus ref_file, connected from the BOLD reference workflow.
realignment_settings:
  step: "init_bold_hmc_wf (head-motion estimation)"
  job: "mcflirt"
  wraps: fsl
  settings:
    reference_scan:
      option: "-reffile (ref_file)"
      ranges:
        - to_version: "1.1.0"
          set: true
          value: "a BOLD reference image: the median of the detected non-steady-state volumes, else of volumes 20-40 after AFNI 3dvolreg alignment"
          source: "nipreps/fmriprep 1.0.0: fmriprep/workflows/bold/hmc.py line 79 (ref_file from the BOLD reference), bold/util.py line 91 (EstimateReferenceImage); niworkflows 0.2.2 interfaces/registration.py lines 328-330 (3dvolreg) and 363-386 (median, volumes 20-40)."
        - from_version: "1.2.0"
          to_version: "20.2.0"
          set: true
          value: "a BOLD reference image: the median of the detected non-steady-state volumes, else of volumes 20-40 after AFNI 3dvolreg alignment; the single-band reference (SBRef) when present"
          source: "nipreps/fmriprep 1.2.0 bold/util.py line 125 (the SBRef replaces the BOLD median when present; '--ignore sbref' turns it off); from 1.5.0 the same interface through niworkflows func/util.py (line 113 at niworkflows 1.0.2); hmc.py ref_file line 87 at 1.2.0."
        - from_version: "21.0.0"
          to_version: "23.1.0"
          set: true
          value: "a BOLD reference image: the median of the detected non-steady-state volumes, else of the 20 volumes ending at volume 40 after AFNI 3dvolreg alignment; the single-band reference (SBRef) when present"
          source: "niworkflows 1.4.5 func/util.py lines 190 and 214 (RobustAverage, NonsteadyStatesDetector), interfaces/images.py lines 218-224 (3dvolreg) and bold.py lines 42-55 and 93-99 (the 40/20 window); nipreps/fmriprep 21.0.0 workflows/bold/base.py line 442 (sbref_files); hmc.py ref_file line 117 at 21.0.0."
        - from_version: "23.2.0"
          set: true
          value: "a BOLD reference image: the median of the detected non-steady-state volumes, else of the 20 volumes ending at volume 40 after AFNI 3dvolreg alignment; the SBRef is not used"
          source: "nipreps/fmriprep 23.2.0 workflows/bold/reference.py line 120 (gen_avg), fit.py line 380 and lines 439-440 (no SBRef), fit.py line 415 (a precomputed hmc_boldref may be supplied); reference.py line 114 at 25.2.0."
    interpolation_estimate:
      option: "-stages"
      ranges:
        - set: false
          source: "nipreps/fmriprep workflows/bold/hmc.py: the MCFLIRT node sets output flags only (line 68 at 1.0.0 to line 93 at 25.0.0), so MCFLIRT estimates with its own interpolation"
    interpolation_reslice:
      option: "MCFLIRT out_file"
      ranges:
        - set: true
          value: "not from MCFLIRT: its resampled output is never used; fMRIPrep applies the transforms in a later resampling step"
          source: "nipreps/fmriprep workflows/bold/hmc.py: the mcflirt node's outgoing connections carry mat_file (to MCFLIRT2ITK), par_file and rms_files, never out_file (lines 83-84 at 1.0.0, 101-103 at 20.2.0, 102 at 25.0.0)."
    cost_function:
      option: "-cost"
      ranges:
        - set: false
          source: "nipreps/fmriprep workflows/bold/hmc.py: the MCFLIRT node does not set cost (line 68 at 1.0.0 to line 93 at 25.0.0)"

versions:
  - version: "1.0.0"
    release_date: "2017-12-07"
    release_source: "https://github.com/nipreps/fmriprep/releases/tag/1.0.0"
    param_defaults:
      # First use of the B1 target_surface-conditional machinery. surface_registration is
      # DERIVED from the paper's extracted surface_projection.target_surface (ceiling 0.70).
      surface_projection.surface_registration:
        value:
          conditional_on: surface_projection.target_surface
          rules:
            - when: [native, fsaverage, fsaverage5, fsaverage6]
              value: freesurfer_recon
              proposed_confidence: 0.70
              source: "fMRIPrep aligns FreeSurfer surface targets (native/fsaverage*) via recon-all folding-based spherical registration at all versions; MSM applies only to fsLR. Enum 'freesurfer_recon' = the FreeSurfer-reconstruction-driven registration path."
            - when: [fsLR_32k]
              value: freesurfer_recon
              proposed_confidence: 0.65
              source: "Before fMRIPrep 23.2.0, fsLR alignment (91k grayordinate / 32k mesh) used FreeSurfer folding-based registration (no MSM); MSM-Sulc became the default only at 23.2.0 (nipreps/fmriprep CHANGES.rst 23.2.0, 2024-01-10; PR #3085), so pre-23.2.0 -> freesurfer_recon."
