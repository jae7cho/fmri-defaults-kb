pipeline_id: xcp_d
display_name: XCP-D (eXtensible Connectivity Pipeline - DCAN)
aliases:
  - xcp_d
  - XCP-D
  - xcp-d
  - XCP-D pipeline
  - extensible connectivity pipeline
  - extensible connectivity pipelines
  - eXtensible Connectivity Pipeline-DCAN
  - xcp_abcd
component_tools: []
notes: |
  Added 2026-11-24 (the author's KB request; yang_2025 postprocesses with XCP-D 0.2.2). XCP-D
  (github.com/PennLINC/xcp_d) postprocesses fMRIPrep, HCP, DCAN and Nibabies outputs: confound
  regression, censoring, interpolation, band-pass filtering, parcellation and functional
  connectivity. It does no realignment, so there is no realignment_tool block. Releases 0.0.1 to
  0.0.8 shipped as xcp_abcd. Versions are the GitHub releases not marked pre-release; the 0.4.0
  release is tagged "04.0" upstream and is recorded as tagged.

  param_defaults come from the command-line parser at each tag (xcp_abcd/cli/run.py,
  xcp_d/cli/run.py, or xcp_d/cli/parser.py from 0.7.1), read by syntax tree, and from the confound
  model definitions in utils/confounds.py. Changes across releases: nuisance model 27P to 0.0.8,
  36P from 0.0.9; FD censoring threshold 0.3 mm to 0.1.3, 0.2 mm from 0.2.0 to 0.3.2, 0.3 mm from
  04.0 to 0.7.5; band-pass lower cut-off 0.009 Hz to 0.3.2, 0.01 Hz from 04.0 (upper 0.08 Hz and
  order 2 throughout). From 0.8.0 --mode (abcd, hbcd or linc) is required and sets censoring,
  despiking and other options (at 0.8.0, parser.py lines 939-986: fd_thresh 0.3 for abcd and hbcd,
  0 (no censoring) for linc; despike on in all three), so those records carry no step defaults.

  Not recorded: spatial smoothing (--smoothing, default 6 mm FWHM from 0.0.4) produces a separate
  smoothed output; at 0.2.2 the parcellated and connectivity time series come from the unsmoothed
  band-passed data (xcp_d/workflow/cifti.py lines 494 and 498), so the default is not a smoothing
  default for connectivity. Detrending and the censor-interpolate-filter order are described in the
  workflow boilerplate and were checked only at 0.2.2 (workflow/cifti.py lines 198-215).

