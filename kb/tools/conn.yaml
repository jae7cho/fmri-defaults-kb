programs:
  - name: "conn"
    purpose: "a MATLAB/SPM toolbox for functional connectivity analysis with its own preprocessing and denoising pipelines (SPM-based preprocessing; aCompCor, scrubbing and band-pass denoising)"
    source: "Whitfield-Gabrieli, S. & Nieto-Castanon, A. (2012). Conn: a functional connectivity toolbox for correlated and anticorrelated brain networks. Brain Connectivity 2:125-141."
notes: "Added 2026-11-05 (fix 5 of the agent's stress_v1 list) for the agent's KB software scan; Achuthan_2023 and Li_2024 preprocess with it. No realignment block: CONN's realignment is SPM's (spm realign), which the SPM document answers. The version is written separately ('CONN 20.b', 'CONN toolbox version 21a'); the scan reads only a dotted number after the name. Title-case 'Conn' is matched only as part of a toolbox phrase (Achuthan_2023 writes 'Conn Connectivity toolbox'), since 'Conn' alone is also a surname."
