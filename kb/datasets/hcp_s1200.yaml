notes: |
  The manual describes the minimally preprocessed packages as produced by the HCP pipelines and lists "Functional Pipeline v3.1" in its description of a preprocessed package (p. 17); p. 11 names HCP pipelines v3.4 for the MSM-Sulc change and later versions for individual pipelines; pipeline_version records that statement. hcp_minimal's version timeline lists v3.4.0 and v4.1.3 only, so v3.1 resolves to no listed version; the realignment program (MCFLIRT) is the same at both listed versions.
  The S1200 release is the final HCP Young Adult (HCP-YA) release; the family aliases HCP-YA and HCP Young Adult resolve to this family.
