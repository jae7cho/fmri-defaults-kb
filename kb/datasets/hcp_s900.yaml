notes: |
  The manual describes the minimally preprocessed packages as produced by the HCP pipelines and lists "Functional Pipeline v3.1" in its description of a preprocessed package (p. 12); p. 8 says some pipelines were upgraded to v3.4 or later; pipeline_version records that statement. hcp_minimal's version timeline lists v3.4.0 and v4.1.3 only, so v3.1 resolves to no listed version; the realignment program (MCFLIRT) is the same at both listed versions.
