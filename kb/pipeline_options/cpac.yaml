- id: registration_workflows.anatomical_registration.registration.ANTs.T1_registration
  help: ANTs parameters for T1-template-based registration
  available:
    from_version: 1.8.0
    to_version: 1.8.7
  ranges:
  - from_version: 1.8.0
    to_version: 1.8.7
    default:
    - collapse-output-transforms: 0
    - dimensionality: 3
    - initial-moving-transform:
        initializationFeature: 0
    - transforms:
      - Rigid:
          gradientStep: 0.1
          metric:
            type: MI
            metricWeight: 1
            numberOfBins: 32
            samplingStrategy: Regular
            samplingPercentage: 0.25
          convergence:
            iteration: 1000x500x250x100
            convergenceThreshold: 1e-08
            convergenceWindowSize: 10
          smoothing-sigmas: 3.0x2.0x1.0x0.0
          shrink-factors: 8x4x2x1
          use-histogram-matching: true
      - Affine:
          gradientStep: 0.1
          metric:
            type: MI
            metricWeight: 1
            numberOfBins: 32
            samplingStrategy: Regular
            samplingPercentage: 0.25
          convergence:
            iteration: 1000x500x250x100
            convergenceThreshold: 1e-08
            convergenceWindowSize: 10
          smoothing-sigmas: 3.0x2.0x1.0x0.0
          shrink-factors: 8x4x2x1
          use-histogram-matching: true
      - SyN:
          gradientStep: 0.1
          updateFieldVarianceInVoxelSpace: 3.0
          totalFieldVarianceInVoxelSpace: 0.0
          metric:
            type: CC
            metricWeight: 1
            radius: 4
          convergence:
            iteration: 100x100x70x20
            convergenceThreshold: 1e-09
            convergenceWindowSize: 15
          smoothing-sigmas: 3.0x2.0x1.0x0.0
          shrink-factors: 6x4x2x1
          use-histogram-matching: true
          winsorize-image-intensities:
            lowerQuantile: 0.01
            upperQuantile: 0.99
    source: dev/docker_data/default_pipeline.yml line 522 at 1.8.0; CPAC/resources/configs/pipeline_config_default.yml
